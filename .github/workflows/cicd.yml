name: "[revolution.chnm.org] Hugo Build, Release, Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "preview"

jobs:

  hugo-build-release-deploy:
    uses: chnm/.github/.github/workflows/hugo--build-release-deploy.yml@main
    secrets: inherit
    with:

      # This repo is a single Hugo site at the root (not a monorepo subdir),
      # so the build context is the repository root.
      hugo-context-root: "."
      hugo-devl-url: "https://revolution.dev.chnm.gmu.edu"
      hugo-prod-url: "https://revolution.dev.chnm.gmu.edu"

      release-tag-name-type: "iso"

      website-devl-fqdn: "revolution.dev.chnm.gmu.edu"
      website-prod-fqdn: "revolution.chnm.org"
