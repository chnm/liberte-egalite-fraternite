<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.5.3/dist/js/foundation.min.js"></script>
<script src="/js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.jQuery && jQuery.fn.foundation) {
      jQuery(document).foundation();
      // About dropdown: Foundation 6.5 never sets aria-expanded on the toggle,
      // and Escape sends focus to the first top-level item (4.1.2). Watch the
      // submenu itself, and catch Escape in the capture phase because
      // Foundation stops its propagation.
      var toggle = document.querySelector('#top-nav .dropdown-toggle');
      var sub = toggle && toggle.parentElement.querySelector('ul');
      if (sub) {
        var sync = function () { toggle.setAttribute('aria-expanded', sub.offsetParent ? 'true' : 'false'); };
        sync();
        new MutationObserver(sync).observe(sub, { attributes: true, attributeFilter: ['class', 'style'] });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && sub.contains(e.target)) setTimeout(function () { toggle.focus(); });
        }, true);
      }
    }
    // Browse "go to page N" jump box.
    document.querySelectorAll('.page-input form').forEach(function (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var base = f.getAttribute('data-base') || '/';
        var n = parseInt(f.elements.page.value, 10);
        if (!n || n < 1) return;
        window.location.href = (n === 1) ? base : base + 'page/' + n + '/';
      });
    });
  });
</script>
